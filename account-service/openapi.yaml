openapi: 3.1.0
info:
  title: Account Service API
  version: 1.0.0
paths:
  /api/v1/accounts:
    post:
      summary: Create an account idempotently
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAccountRequest'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/accounts/{accountId}:
    get:
      summary: Get account details
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/accounts/{accountId}/status:
    put:
      summary: Change account status
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: {status: {type: string, enum: [ACTIVE, BLOCKED, CLOSED]}}
      responses:
        '200': {description: Updated account, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    AccountId: {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    CreateAccountRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: {type: string, maxLength: 100}
        lastName: {type: string, maxLength: 100}
    Account:
      type: object
      required: [accountId, firstName, lastName, balance, status, createdAt, updatedAt]
      properties:
        accountId: {type: string, format: uuid}
        firstName: {type: string}
        lastName: {type: string}
        balance: {type: number, multipleOf: 0.0001}
        status: {type: string, enum: [ACTIVE, BLOCKED, CLOSED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ApiError:
      type: object
      required: [code, message, timestamp, path]
      properties:
        code: {type: string}
        message: {type: string}
        timestamp: {type: string, format: date-time}
        path: {type: string}
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    NotFound: {description: Account not found, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    Conflict: {description: Business or idempotency conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
