server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: mobile-bff
  codec:
    max-in-memory-size: 256KB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
mobile:
  account-service-base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8081}
  financial-operations-service-base-url: ${FINANCIAL_OPERATIONS_SERVICE_BASE_URL:http://localhost:8082}
