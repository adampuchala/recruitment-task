---
# ============================================================
# MOBILE BFF
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: mobile-bff
  namespace: bank
spec:
  type: NodePort
  selector:
    app: mobile-bff
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-bff
  namespace: bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobile-bff
  template:
    metadata:
      labels:
        app: mobile-bff
    spec:

      initContainers:
        - name: wait-for-account-service
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              until curl -fsS http://account-service:8081/actuator/health
              do
                echo "Waiting for account-service..."
                sleep 2
              done

        - name: wait-for-financial-service
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              until curl -fsS http://financial-operations-service:8082/actuator/health
              do
                echo "Waiting for financial-operations-service..."
                sleep 2
              done

      containers:
        - name: mobile-bff
          image: recruitment-task-main-mobile-bff:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ACCOUNT_SERVICE_BASE_URL
              value: http://account-service:8081
            - name: FINANCIAL_OPERATIONS_SERVICE_BASE_URL
              value: http://financial-operations-service:8082
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
